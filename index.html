    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* CSS STARTS HERE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f4f4; color: #1a1a1a; padding: 20px 40px; }
        
        nav { display: flex; justify-content: space-between; padding: 40px 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        nav a { text-decoration: none; color: #1a1a1a; margin-left: 20px; }

        header { padding: 80px 0; }
        header h1 { font-size: clamp(2.5rem, 6vw, 5rem); line-height: 1; letter-spacing: -2px; font-weight: 700; max-width: 1000px; }

        /* The Bento Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 320px;
            gap: 15px;
        }

        .item { 
            position: relative; 
            background: #fff; 
            border-radius: 28px; /* Smooth rounded corners */
            overflow: hidden;
            transition: transform 0.4s ease;
        }
        
        .item:hover { transform: scale(0.98); }
        .item img { width: 100%; height: 100%; object-fit: cover; }

        /* Grid Logic */
        .large { grid-column: span 2; grid-row: span 2; }
        .tall { grid-row: span 2; }
        .wide { grid-column: span 2; }

        /* Mobile View */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr 1fr; }
            .large, .wide, .tall { grid-column: span 2; grid-row: span 1; }
        }
    </style>
</head>
